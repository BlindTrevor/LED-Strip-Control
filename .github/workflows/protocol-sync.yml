name: Shared header sync

# Protocol.h and Effects.h are duplicated because Arduino IDE 2.x only compiles
# headers that live in the sketch folder.
#
#   Protocol.h  if the copies drift the structs stop agreeing, the satellites
#               decode garbage, and nothing reports an error - the I2C writes
#               still succeed.
#   Effects.h   if the copies drift the controller's Preview tab confidently
#               shows a different look from the one the tape renders.
#
# So: fail the build instead.

on:
  push:
    paths:
      - '**/Protocol.h'
      - '**/Effects.h'
      - '.github/workflows/protocol-sync.yml'
      - 'tools/check-protocol-sync.ps1'
  pull_request:
    paths:
      - '**/Protocol.h'
      - '**/Effects.h'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the shared headers across both sketch folders
        shell: pwsh
        run: ./tools/check-protocol-sync.ps1
